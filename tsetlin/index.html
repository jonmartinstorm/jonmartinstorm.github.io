<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tsetlin Rejection Classifier (standalone)</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, Arial, sans-serif;
      }
      body { margin: 2rem auto; max-width: 760px; padding: 0 1rem; }
      form { display: grid; gap: 0.75rem; }
      textarea { min-height: 180px; width: 100%; padding: 0.75rem; line-height: 1.4; }
      .hint { font-size: 0.9rem; opacity: 0.8; }
      .card {
        margin-top: 1rem;
        border: 1px solid color-mix(in oklab, currentColor 20%, transparent);
        border-radius: 10px;
        padding: 1rem;
      }
      .top-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
      .label-pill {
        display: inline-block; padding: 0.25rem 0.6rem; border-radius: 999px; font-weight: 700;
        border: 1px solid color-mix(in oklab, currentColor 25%, transparent);
      }
      .confidence { min-width: 160px; }
      .confidence-bar {
        height: 8px; border-radius: 999px;
        background: color-mix(in oklab, currentColor 18%, transparent); overflow: hidden;
      }
      .confidence-fill { height: 100%; background: #3b82f6; }
      .vote-list { margin-top: 0.75rem; display: grid; gap: 0.45rem; }
      .vote-row { display: grid; grid-template-columns: 1fr 70px; gap: 0.5rem; align-items: center; }
      .vote-track {
        height: 22px; border-radius: 6px;
        background: color-mix(in oklab, currentColor 14%, transparent);
        overflow: hidden; position: relative;
      }
      .vote-fill { height: 100%; background: #10b981; }
      .vote-label { position: absolute; left: 8px; top: 2px; font-size: 0.85rem; white-space: nowrap; }
      .rule {
        margin-top: 0.75rem; padding: 0.7rem; border-radius: 8px;
        background: color-mix(in oklab, currentColor 8%, transparent); font-size: 0.95rem;
      }
      .rule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.5rem; }
      .rule-col h4 { margin: 0 0 0.35rem; font-size: 0.9rem; }
      .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
      .chip {
        border-radius: 999px; padding: 0.2rem 0.5rem; font-size: 0.83rem;
        border: 1px solid color-mix(in oklab, currentColor 20%, transparent);
      }
      .chip.pos { background: color-mix(in oklab, #10b981 18%, transparent); }
      .chip.neg { background: color-mix(in oklab, #ef4444 18%, transparent); }
      .muted { opacity: 0.75; font-size: 0.85rem; }
      #error { margin-top: 0.5rem; color: #d33; }
    </style>
  </head>
  <body>
    <h1>Tsetlin Rejection Classifier</h1>
    <p>
      Fully client-side: the model is embedded in this file as a gzipped binary
      and every keystroke is classified locally — no server, no network.
    </p>

      // ---- TMB1 decoder (mirror of tm_model.ts, plain JS) ------------------
      class Reader {
        constructor(buf) { this.buf = buf; this.pos = 0; }
        varint() {
          let result = 0, shift = 0;
          for (;;) {
            const b = this.buf[this.pos++];
            if (b === undefined) throw new Error("TMB1: unexpected end of data");
            result |= (b & 0x7f) << shift;
            if ((b & 0x80) === 0) return result >>> 0;
            shift += 7;
          }
        }
        zigzag() { const n = this.varint(); return (n >>> 1) ^ -(n & 1); }
        string() {
          const len = this.varint();
          const bytes = this.buf.subarray(this.pos, this.pos + len);
          this.pos += len;
          return new TextDecoder().decode(bytes);
        }
        idList() {
          const n = this.varint(), ids = new Array(n);
          let prev = -1;
          for (let i = 0; i < n; i++) { prev += this.varint() + 1; ids[i] = prev; }
          return ids;
        }
      }

      function decodeModel(bytes) {
        if (bytes[0] !== 0x54 || bytes[1] !== 0x4d || bytes[2] !== 0x42 || bytes[3] !== 0x31) {
          throw new Error("Not a TMB1 model file");
        }
        const r = new Reader(bytes.subarray(4));
        const labels = [], features = [], classes = [];
        const nLabels = r.varint();
        for (let i = 0; i < nLabels; i++) labels.push(r.string());
        const nFeatures = r.varint();
        for (let i = 0; i < nFeatures; i++) features.push(r.string());
        for (let c = 0; c < nLabels; c++) {
          const nRules = r.varint(), rules = new Array(nRules);
          for (let j = 0; j < nRules; j++) {
            const w = r.zigzag();
            rules[j] = { w, pos: r.idList(), neg: r.idList() };
          }
          classes.push(rules);
        }
        return { labels, features, classes, featIndex: new Map(features.map((f, i) => [f, i])) };
      }

      async function loadEmbeddedModel() {
        const bin = atob(MODEL_B64_GZ);
        const gz = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) gz[i] = bin.charCodeAt(i);
        const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
        const raw = new Uint8Array(await new Response(stream).arrayBuffer());
        return decodeModel(raw);
      }

      // ---- Inference (identical to server.ts) -------------------------------
      function tokenize(text) {
        return text.toLowerCase().match(/[\p{L}\p{N}_]{2,}/gu) ?? [];
      }

      function featurize(text, featIndex) {
        const tokens = tokenize(text);
        const grams = new Set(tokens);
        for (let i = 0; i < tokens.length - 1; i++) grams.add(`${tokens[i]} ${tokens[i + 1]}`);
        const present = new Set();
        for (const gram of grams) {
          const idx = featIndex.get(gram);
          if (idx !== undefined) present.add(idx);
        }
        return present;
      }

      function classify(text, model) {
        const present = featurize(text, model.featIndex);
        const votes = [];
        for (let i = 0; i < model.labels.length; i++) {
          let score = 0;
          for (const rule of model.classes[i] ?? []) {
            const posOk = rule.pos.every((k) => present.has(k));
            const negOk = !rule.neg.some((k) => present.has(k));
            if (posOk && negOk) score += rule.w;
          }
          votes.push({ label: model.labels[i], score });
        }
        votes.sort((a, b) => b.score - a.score);
        const predicted = votes[0]?.label ?? "unknown";
        const confidence = Math.max(0, Math.min(1,
          ((votes[0]?.score ?? 0) - (votes[1]?.score ?? 0) + 50) / 100));

        const firingRules = [];
        const classIndex = model.labels.indexOf(predicted);
        if (classIndex >= 0) {
          for (const rule of model.classes[classIndex] ?? []) {
            if (rule.w <= 0) continue;
            const posOk = rule.pos.every((k) => present.has(k));
            const negOk = !rule.neg.some((k) => present.has(k));
            if (!posOk || !negOk) continue;
            firingRules.push({
              weight: rule.w,
              because: rule.pos.map((k) => model.features[k]),
              unless: rule.neg.map((k) => model.features[k]),
            });
          }
          firingRules.sort((a, b) => b.weight - a.weight);
        }
        const topRules = firingRules.slice(0, 3);
        return { label: predicted, votes, confidence, topRules };
      }

      // ---- UI wiring --------------------------------------------------------
      const textEl = document.getElementById("text");
      const resultEl = document.getElementById("result");
      const errorEl = document.getElementById("error");
      const statusEl = document.getElementById("status");
      let debounceTimer = null;
      let model = null;

      function esc(value) {
        return String(value)
          .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
      }

      function renderResult(payload) {
        const confidencePct = Math.round((payload.confidence || 0) * 100);
        const votes = Array.isArray(payload.votes) ? payload.votes : [];
        const maxVote = votes.length ? Math.max(...votes.map((v) => v.score), 1) : 1;
        const minVote = votes.length ? Math.min(...votes.map((v) => v.score), 0) : 0;
        const span = Math.max(1, maxVote - minVote);

        const voteHtml = votes.map((v) => {
          const pct = Math.max(6, Math.round(((v.score - minVote) / span) * 100));
          return `
            <div class="vote-row">
              <div class="vote-track">
                <div class="vote-fill" style="width:${pct}%"></div>
                <span class="vote-label">${esc(v.label)}</span>
              </div>
              <strong>${v.score}</strong>
            </div>`;
        }).join("");

        const topRules = Array.isArray(payload.topRules) ? payload.topRules : [];
        const rulesHtml = topRules.length ? topRules.map((rule, i) => `
          <div class="rule">
            <strong>Rule ${i + 1}</strong>
            <div class="muted">Weight: ${rule.weight}</div>
            <div class="rule-grid">
              <div class="rule-col">
                <h4>Does contain</h4>
                <div class="chips">
                  ${rule.because.length
                    ? rule.because.map((t) => `<span class="chip pos">${esc(t)}</span>`).join("")
                    : `<span class="muted">No required terms</span>`}
                </div>
              </div>
              <div class="rule-col">
                <h4>Does not contain</h4>
                <div class="chips">
                  ${rule.unless.length
                    ? rule.unless.map((t) => `<span class="chip neg">${esc(t)}</span>`).join("")
                    : `<span class="muted">No blocked terms</span>`}
                </div>
              </div>
            </div>
          </div>`).join("") : `
          <div class="rule">
            <strong>Top rules:</strong> No strong positive rule matched this input.
          </div>`;

        resultEl.innerHTML = `
          <div class="card">
            <div class="top-row">
              <div>
                <div>Top category</div>
                <span class="label-pill">${esc(payload.label)}</span>
              </div>
              <div class="confidence">
                <div>Confidence</div>
                <div class="confidence-bar">
                  <div class="confidence-fill" style="width:${confidencePct}%"></div>
                </div>
                <small>${confidencePct}%</small>
              </div>
            </div>
            <div class="vote-list">${voteHtml}</div>
            ${rulesHtml}
          </div>`;
      }

      function classifyNow() {
        const text = textEl.value.trim();
        resultEl.innerHTML = "";
        errorEl.textContent = "";
        if (!text || !model) return;
        try {
          renderResult(classify(text, model));
        } catch (err) {
          errorEl.textContent = err instanceof Error ? err.message : "Unexpected error.";
        }
      }

      textEl.addEventListener("input", () => {
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(classifyNow, 120);
      });

      loadEmbeddedModel()
        .then((m) => {
          model = m;
          statusEl.textContent =
            `Model loaded: ${m.labels.length} classes, ` +
            `${m.classes.reduce((s, c) => s + c.length, 0)} rules, ` +
            `${m.features.length} n-grams. Live classification while you type.`;
          classifyNow();
        })
        .catch((err) => {
          statusEl.textContent = "";
          errorEl.textContent = `Failed to load embedded model: ${err.message}`;
        });
    </script>
  </body>
